name = "livingdex-worker"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The Living Dex domain Worker: real rarity from GBIF occurrence density +
# grounded fact-sheets (GBIF taxonomy/IUCN + Wikipedia summary). No secrets —
# all upstreams are free, keyless public APIs. LLM inference is NOT here; it
# routes through mako. Deploy: `npx wrangler deploy`.

[observability]
enabled = true

# Native Workers rate limiting (GA, no extra infra): a soft per-IP cap in front
# of the /v1/* endpoints so anonymous callers can't burst the GBIF fan-out. A
# normal capture is one /v1/enrich; 60/min/IP is generous for real use.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
